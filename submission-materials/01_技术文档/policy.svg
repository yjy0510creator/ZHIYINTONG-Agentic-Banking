<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450"><rect width="1200" height="450" fill="white"/><rect x="45" y="20" width="1110" height="100" rx="6" fill="#EDF7FD" stroke="#116CB0"/><text x="61" y="51" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#116CB0">不可变授权快照</text><text x="61" y="81" font-family="Microsoft YaHei" font-size="19" fill="#526B80">交易 + Maker + 幂等键 + 策略版本 / 指纹 / 代次 + 沙箱结果</text><rect x="45" y="180" width="330" height="100" rx="6" fill="#EDF7FD" stroke="#116CB0"/><text x="61" y="211" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#116CB0">Maker / MFA</text><text x="61" y="241" font-family="Microsoft YaHei" font-size="19" fill="#526B80">绑定 authorization_digest</text><rect x="435" y="180" width="330" height="100" rx="6" fill="#EDF7FD" stroke="#116CB0"/><text x="451" y="211" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#116CB0">Checker</text><text x="451" y="241" font-family="Microsoft YaHei" font-size="19" fill="#526B80">持久化完整审批绑定</text><rect x="825" y="180" width="330" height="100" rx="6" fill="#EDF7FD" stroke="#116CB0"/><text x="841" y="211" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#116CB0">最终执行</text><text x="841" y="241" font-family="Microsoft YaHei" font-size="19" fill="#526B80">同一事务再次核验</text><rect x="45" y="340" width="1110" height="85" rx="6" fill="#EDF7FD" stroke="#116CB0"/><text x="61" y="371" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#116CB0">策略发生变化 → POLICY_STALE</text><text x="61" y="401" font-family="Microsoft YaHei" font-size="19" fill="#526B80">旧授权与沙箱许可失效；必须创建新工作流</text><text x="588" y="168" font-size="36" fill="#22AFD0">↓</text><text x="588" y="328" font-size="36" fill="#22AFD0">↓</text></svg>